<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — instant, no signup</title>
<style>
  :root{
    --paper: #EAF0F2; --paper-line: #C7D5DA; --ink: #16324F; --ink-soft: #4A6274;
    --brass: #C98A3C; --brass-dark: #A06A24; --teal: #2E7D6B; --panel: #FFFFFF;
    --mono: 'IBM Plex Mono', 'Courier New', monospace; --sans: 'IBM Plex Sans', 'Segoe UI', sans-serif;
    --radius: 4px;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    background: repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px), var(--paper);
    color: var(--ink); font-family: var(--sans); min-height: 100vh;
    display:flex; flex-direction:column; align-items:center; padding: 32px 16px 64px;
  }
  @media (prefers-reduced-motion: reduce){ * { transition: none !important; animation: none !important; } }
  .ruler{ width:100%; max-width: 640px; height: 34px; position: relative; margin-bottom: 8px; border-bottom: 2px solid var(--ink); }
  .ruler .tick{ position:absolute; bottom:0; width:1px; background: var(--ink-soft); }
  header{ width:100%; max-width: 640px; margin-bottom: 28px; }
  h1{ font-family: var(--mono); font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: -0.5px; margin: 0 0 4px; }
  h1 span{ color: var(--brass-dark); }
  .subtitle{ color: var(--ink-soft); font-size: 14px; margin: 0; letter-spacing: 0.3px; }
  .panel{ width:100%; max-width: 640px; background: var(--panel); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: 4px 4px 0 var(--ink); }
  .body{ padding: 28px 24px 24px; }
  .field{ margin-bottom: 18px; }
  .field label{ display:block; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); margin-bottom: 6px; }
  .field input, .field select{ width:100%; font-family: var(--mono); font-size: 16px; padding: 10px 10px; border: 1.5px solid var(--ink); border-radius: var(--radius); background: var(--paper); color: var(--ink); }
  .field input:focus, .field select:focus{ outline: 2px solid var(--teal); outline-offset: 1px; }
  .row{ display:flex; gap:14px; }
  .row .field{ flex:1; }
  .btn{
    width:100%; font-family: var(--mono); font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    padding: 12px; border: 1.5px solid var(--ink); border-radius: var(--radius); background: var(--brass); color: var(--panel);
    cursor:pointer; font-weight:700;
  }
  .btn:hover{ background: var(--brass-dark); }
  .btn:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }
  .btn.secondary{ background: var(--panel); color: var(--ink); margin-top: 10px; }
  .readout{ margin-top: 22px; padding: 22px; background: var(--ink); border-radius: var(--radius); display:flex; flex-direction:column; align-items:center; }
  .readout .label{ font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--brass); margin-bottom: 14px; align-self:flex-start; }
  #qr-canvas{ background:#fff; padding: 12px; border-radius: var(--radius); }
  footer{ max-width: 640px; width:100%; margin-top: 20px; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); text-align:center; }
</style>
</head>
<body>

<div class="ruler" id="ruler"></div>

<header>
  <h1>QR<span>.gen</span></h1>
  <p class="subtitle">Text, links, WiFi — turned into a scannable code, instantly</p>
</header>

<div class="panel">
  <div class="body">
    <div class="field">
      <label for="qr-text">Text or link</label>
      <input type="text" id="qr-text" placeholder="https://example.com" value="">
    </div>
    <div class="row">
      <div class="field">
        <label for="qr-size">Size</label>
        <select id="qr-size">
          <option value="200">Small (200px)</option>
          <option value="300" selected>Medium (300px)</option>
          <option value="450">Large (450px)</option>
        </select>
      </div>
    </div>
    <button class="btn" id="qr-generate">Generate QR code</button>

    <div class="readout" id="qr-readout" style="display:none;">
      <div class="label">Result</div>
      <canvas id="qr-canvas"></canvas>
      <button class="btn secondary" id="qr-download">Download PNG</button>
    </div>
  </div>
</div>

<footer>
  QR rendering runs entirely in your browser · No data leaves your device
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const ruler = document.getElementById('ruler');
  function drawTicks(){
    ruler.innerHTML = '';
    const width = ruler.offsetWidth;
    const count = Math.floor(width / 14);
    for(let i=0;i<=count;i++){
      const tick = document.createElement('div');
      tick.className = 'tick';
      const isMajor = i % 5 === 0;
      tick.style.left = (i*14) + 'px';
      tick.style.height = isMajor ? '16px' : '8px';
      ruler.appendChild(tick);
    }
  }
  drawTicks();
  window.addEventListener('resize', drawTicks);

  const textInput = document.getElementById('qr-text');
  const sizeSelect = document.getElementById('qr-size');
  const generateBtn = document.getElementById('qr-generate');
  const readout = document.getElementById('qr-readout');
  const downloadBtn = document.getElementById('qr-download');
  let qr = null;
  let qrContainer = null;

  generateBtn.addEventListener('click', () => {
    const text = textInput.value.trim();
    if(!text) { textInput.focus(); return; }
    const size = parseInt(sizeSelect.value);

    const canvasWrap = document.getElementById('qr-canvas');
    canvasWrap.innerHTML = '';
    canvasWrap.removeAttribute('width');
    canvasWrap.removeAttribute('height');

    const tempDiv = document.createElement('div');
    new QRCode(tempDiv, {
      text: text,
      width: size,
      height: size,
      colorDark: "#16324F",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    setTimeout(() => {
      const img = tempDiv.querySelector('img') || tempDiv.querySelector('canvas');
      canvasWrap.replaceWith(img);
      img.id = 'qr-canvas';
      readout.style.display = 'flex';
      downloadBtn.dataset.ready = 'true';
    }, 100);
  });

  downloadBtn.addEventListener('click', () => {
    const el = document.getElementById('qr-canvas');
    if(!el) return;
    const link = document.createElement('a');
    link.download = 'qrcode.png';
    if(el.tagName === 'CANVAS'){
      link.href = el.toDataURL('image/png');
    } else {
      link.href = el.src;
    }
    link.click();
  });
</script>

</body>
</html>
