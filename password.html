<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — strong, instant, private</title>
<style>
  :root{
    --paper: #EAF0F2; --paper-line: #C7D5DA; --ink: #16324F; --ink-soft: #4A6274;
    --brass: #C98A3C; --brass-dark: #A06A24; --teal: #2E7D6B; --panel: #FFFFFF;
    --mono: 'IBM Plex Mono', 'Courier New', monospace; --sans: 'IBM Plex Sans', 'Segoe UI', sans-serif;
    --radius: 4px;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    background: repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px), var(--paper);
    color: var(--ink); font-family: var(--sans); min-height: 100vh;
    display:flex; flex-direction:column; align-items:center; padding: 32px 16px 64px;
  }
  @media (prefers-reduced-motion: reduce){ * { transition: none !important; animation: none !important; } }
  .ruler{ width:100%; max-width: 640px; height: 34px; position: relative; margin-bottom: 8px; border-bottom: 2px solid var(--ink); }
  .ruler .tick{ position:absolute; bottom:0; width:1px; background: var(--ink-soft); }
  header{ width:100%; max-width: 640px; margin-bottom: 28px; }
  h1{ font-family: var(--mono); font-size: clamp(28px, 6vw, 40px); font-weight: 700; letter-spacing: -0.5px; margin: 0 0 4px; }
  h1 span{ color: var(--brass-dark); }
  .subtitle{ color: var(--ink-soft); font-size: 14px; margin: 0; letter-spacing: 0.3px; }
  .panel{ width:100%; max-width: 640px; background: var(--panel); border: 1.5px solid var(--ink); border-radius: var(--radius); box-shadow: 4px 4px 0 var(--ink); }
  .body{ padding: 28px 24px 24px; }
  .field{ margin-bottom: 20px; }
  .field label{ display:flex; justify-content:space-between; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); margin-bottom: 8px; }
  .field label .val{ color: var(--brass-dark); font-weight:700; }
  input[type=range]{ width:100%; accent-color: var(--brass); }
  .checks{ display:flex; flex-direction:column; gap: 10px; }
  .check{ display:flex; align-items:center; gap: 10px; font-family: var(--mono); font-size: 13px; }
  .check input{ width:18px; height:18px; accent-color: var(--teal); }
  .btn{
    width:100%; font-family: var(--mono); font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    padding: 12px; border: 1.5px solid var(--ink); border-radius: var(--radius); background: var(--brass); color: var(--panel);
    cursor:pointer; font-weight:700; margin-top: 22px;
  }
  .btn:hover{ background: var(--brass-dark); }
  .btn:focus-visible{ outline: 2px solid var(--teal); outline-offset: 2px; }
  .readout{ margin-top: 20px; padding: 18px; background: var(--ink); border-radius: var(--radius); color: var(--paper); }
  .readout .label{ font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--brass); margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center; }
  .readout .value{ font-family: var(--mono); font-size: clamp(16px, 4.5vw, 20px); font-weight: 700; word-break: break-all; letter-spacing: 1px; }
  .copy-btn{ background:none; border: 1px solid var(--paper-line); color: var(--paper); font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 3px; cursor:pointer; text-transform:uppercase; }
  .copy-btn:hover{ background: var(--teal); border-color: var(--teal); }
  .strength{ margin-top: 12px; font-family: var(--mono); font-size: 11px; color: var(--paper-line); }
  footer{ max-width: 640px; width:100%; margin-top: 20px; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); text-align:center; }
</style>
</head>
<body>

<div class="ruler" id="ruler"></div>

<header>
  <h1>Pass<span>.gen</span></h1>
  <p class="subtitle">Random, strong passwords — generated locally, never sent anywhere</p>
</header>

<div class="panel">
  <div class="body">
    <div class="field">
      <label for="length-slider">Length <span class="val" id="length-val">16</span></label>
      <input type="range" id="length-slider" min="6" max="48" value="16">
    </div>

    <div class="checks">
      <label class="check"><input type="checkbox" id="opt-upper" checked> Uppercase letters (A–Z)</label>
      <label class="check"><input type="checkbox" id="opt-lower" checked> Lowercase letters (a–z)</label>
      <label class="check"><input type="checkbox" id="opt-numbers" checked> Numbers (0–9)</label>
      <label class="check"><input type="checkbox" id="opt-symbols" checked> Symbols (!@#$...)</label>
    </div>

    <button class="btn" id="generate-btn">Generate password</button>

    <div class="readout">
      <div class="label">
        <span>Result</span>
        <button class="copy-btn" id="copy-btn">Copy</button>
      </div>
      <div class="value" id="pass-result">—</div>
      <div class="strength" id="strength-text"></div>
    </div>
  </div>
</div>

<footer>
  Runs entirely in your browser using crypto-secure randomness · Nothing is stored or transmitted
</footer>

<script>
  const ruler = document.getElementById('ruler');
  function drawTicks(){
    ruler.innerHTML = '';
    const width = ruler.offsetWidth;
    const count = Math.floor(width / 14);
    for(let i=0;i<=count;i++){
      const tick = document.createElement('div');
      tick.className = 'tick';
      const isMajor = i % 5 === 0;
      tick.style.left = (i*14) + 'px';
      tick.style.height = isMajor ? '16px' : '8px';
      ruler.appendChild(tick);
    }
  }
  drawTicks();
  window.addEventListener('resize', drawTicks);

  const lengthSlider = document.getElementById('length-slider');
  const lengthVal = document.getElementById('length-val');
  const optUpper = document.getElementById('opt-upper');
  const optLower = document.getElementById('opt-lower');
  const optNumbers = document.getElementById('opt-numbers');
  const optSymbols = document.getElementById('opt-symbols');
  const generateBtn = document.getElementById('generate-btn');
  const passResult = document.getElementById('pass-result');
  const copyBtn = document.getElementById('copy-btn');
  const strengthText = document.getElementById('strength-text');

  lengthSlider.addEventListener('input', () => { lengthVal.textContent = lengthSlider.value; });

  const SETS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    numbers: '0123456789',
    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  };

  function generatePassword(){
    let charset = '';
    if(optUpper.checked) charset += SETS.upper;
    if(optLower.checked) charset += SETS.lower;
    if(optNumbers.checked) charset += SETS.numbers;
    if(optSymbols.checked) charset += SETS.symbols;

    if(!charset){
      passResult.textContent = 'Select at least one option';
      strengthText.textContent = '';
      return;
    }

    const length = parseInt(lengthSlider.value);
    const array = new Uint32Array(length);
    crypto.getRandomValues(array);
    let pass = '';
    for(let i=0;i<length;i++){
      pass += charset[array[i] % charset.length];
    }
    passResult.textContent = pass;

    const varietyCount = [optUpper.checked, optLower.checked, optNumbers.checked, optSymbols.checked].filter(Boolean).length;
    const entropy = Math.log2(charset.length) * length;
    let strength = 'Weak';
    if(entropy > 80) strength = 'Very strong';
    else if(entropy > 60) strength = 'Strong';
    else if(entropy > 40) strength = 'Moderate';
    strengthText.textContent = `~${Math.round(entropy)} bits of entropy · ${strength}`;
  }

  copyBtn.addEventListener('click', () => {
    const text = passResult.textContent;
    if(!text || text === '—') return;
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = 'Copied';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    });
  });

  generateBtn.addEventListener('click', generatePassword);
  [optUpper, optLower, optNumbers, optSymbols, lengthSlider].forEach(el => el.addEventListener('change', generatePassword));

  generatePassword();
</script>

</body>
</html>
